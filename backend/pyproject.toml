[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobos-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "aiosqlite>=0.20,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pdfminer.six>=20240706",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.9,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures quote real URLs and search-result titles verbatim.
"tests/*" = ["E501"]

